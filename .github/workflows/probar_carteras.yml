name: probar-carteras
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probar_carteras.py
      - name: Resultado a la rama prueba-carteras (descartable)
        if: always()
        run: |
          cd probe && git init -q -b prueba-carteras && git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m prueba && git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prueba-carteras
