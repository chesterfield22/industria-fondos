name: probar-carteras
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probar_carteras.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe/
          retention-days: 3
