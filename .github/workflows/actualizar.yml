name: actualizar-datos

on:
  schedule:
    # La CNV recibe la planilla del día D ~20:20 (incompleta, ~85% del AUM) y la revisada (completa) entre
    # las 13 y las 16 del día hábil siguiente. GitHub suele demorar los cron horas: se programan varias corridas.
    - cron: '30 18 * * 1-5'  # 15:30 ART: primera oportunidad de la planilla revisada
    - cron: '0 20 * * 1-5'   # 17:00 ART
    - cron: '30 21 * * 1-5'  # 18:30 ART
    - cron: '30 1 * * 2-6'   # 22:30 ART: primera versión del día
    - cron: '0 13 * * 1-5'   # 10:00 ART
  workflow_dispatch:
    inputs:
      fecha_corte:
        description: 'Fecha de corte (AAAA-MM-DD). Vacío = última fecha completa'
        required: false
      publicar:
        description: 'Publicar en la rama data (si/no). "no" = corrida de prueba'
        required: false
        default: 'si'

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: "Descargar históricos (ArgentinaDatos: respaldo e historia)"
        id: ad
        continue-on-error: true
        timeout-minutes: 15
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/enzonotario/esjs-argentina-datos-api ad
          cd ad
          git sparse-checkout init --cone
          git sparse-checkout set datos/v1/finanzas/fci/fondos datos/v1/cotizaciones/dolares/bolsa datos/v1/cotizaciones/dolares/contadoconliqui datos/v1/cotizaciones/dolares/mayorista
          git checkout main

      - name: Base anterior publicada (respaldo si ArgentinaDatos no está disponible)
        if: steps.ad.outcome != 'success'
        continue-on-error: true
        run: |
          git clone -q --depth 1 --filter=blob:none --no-checkout -b data "https://github.com/${{ github.repository }}" prevdata
          cd prevdata && git sparse-checkout set base && git checkout -q data

      - name: Pipeline (CNV fuente principal)
        env:
          PREV_BASE: prevdata/base
        run: python pipeline/run.py ad/datos/v1 base salida ${{ github.event.inputs.fecha_corte }}

      - name: Salida de prueba en rama prueba (corridas con publicar = no; no toca la rama data)
        if: github.event.inputs.publicar == 'no'
        run: |
          mkdir -p salida/base && cp base/maestro.parquet salida/base/
          cd salida
          git init -q -b prueba
          git config user.name "industria-fondos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "prueba $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prueba

      - name: Publicar en rama data (sin historial, se reemplaza en cada corrida)
        if: github.event.inputs.publicar != 'no'
        run: |
          mkdir -p salida/base && cp base/*.parquet base/fx.csv base/cnv_info.json salida/base/
          cp README.md salida/ 2>/dev/null || true
          cd salida
          git init -q -b data
          git config user.name "industria-fondos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Mantener activo el cron (GitHub lo desactiva tras 60 días sin commits en repos públicos)
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$dias" -ge 45 ]; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git commit --allow-empty -m "keepalive ($dias días sin commits)"
            git push origin HEAD:main
          fi
